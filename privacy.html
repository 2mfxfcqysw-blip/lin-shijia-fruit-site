    <h1>隱私政策</h1>
    <h2>官網與 LINE 客服</h2>
    <p>品牌官網提供品種與品牌資訊，沒有會員註冊、付款或收件資料表單。點選官方 LINE 連結會開啟 LINE 的服務。</p>
    <h2>客服資料的使用</h2>
    <p>客服會使用你主動提供的詢問內容來回覆品項與配送問題。確定需要安排配送或售後時，才視需要核對姓名、聯絡電話、配送地址或訂單資料。單純詢問供應時，只需提供品種、數量及配送縣市等資訊。</p>
    <h2>查詢與更正</h2>
    <p>若要查詢、更正或請求刪除曾提供的個人資料，可透過官方 LINE 客服聯繫。必要時會先核對身分或訂單資訊。</p>
