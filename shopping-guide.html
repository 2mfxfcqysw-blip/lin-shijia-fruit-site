    <h1>購物與售後須知</h1>
    <p>線上訂購暫停中。當季品項、規格、價格及配送需求，可透過官方 LINE 詢問。</p>
    <h2>供應與配送</h2>
    <p>採收受產季、天候與熟度影響。送禮或團購可先告訴我們想要的品種、數量、配送縣市和希望到貨日。可供應品項、運費和配送日期以客服確認為準。</p>
    <h2>到貨與保存</h2>
    <p>果實尚硬時，放在室內陰涼通風處，變軟後再冷藏並儘早享用。各品種的熟成判斷與吃法，可參考官網的<a href="/#varieties">品種介紹</a>。</p>
    <h2>到貨異常與售後</h2>
    <p>如有明顯碰傷、腐壞、短缺或品項不符，請保留外箱、宅配單和果實，儘快拍照並透過官方 LINE 聯繫，以便核對與協助處理。</p>
